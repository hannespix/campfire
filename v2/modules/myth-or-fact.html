:root {
  color-scheme: dark;
  /* Night: the LCD greens of pix·el, darkened for a campfire evening */
  --night-0: #050a05;
  --night-1: #0c170b;
  --night-2: #12210f;
  --night-3: #1b2d17;
  --night-4: #2a4123;
  --lcd-a: #306230;
  --lcd-b: #4c7420;
  --lcd-c: #7a9a1c;
  --lcd-d: #a9c431;
  --lcd-e: #d4ef78;
  --lcd-f: #e3efa8;
  /* Fire: the only warm colours (pixletics flame + pix·el LED) */
  --fire-0: #e8483f;
  --fire-1: #ff5a36;
  --fire-2: #ffae00;
  --fire-3: #ffe06a;
  --fire-4: #fff6c8;
  --wood-0: #3a2414;
  --wood-1: #6b4226;
  --wood-2: #9a6a3c;
  /* Text and lines */
  --ink: #e2f0c6;
  --muted: #9fb48f;
  --line: #2a4123;
  --marker: #ffe45e;
  --bg: var(--night-1);
  --card: var(--night-2);

  --pixel: "Jersey 10", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;

  --px: 4px;            /* one art pixel on screen (scenes scale in whole multiples) */
  --step: 125ms;        /* one animation frame = 8 fps */
  --gutter: max(16px, 4vw);
  --radius: 0;          /* pixel world: no rounded corners */
}

/* Light variant for projectors that wash out dark slides: add data-theme="light" on <html> */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7ef;
  --card: #ffffff;
  --ink: #12280f;
  --muted: #56654f;
  --line: #d3dcc4;
}

/* Meaning colours, ONE mapping for decks, modules and art (tools/art.mjs uses the same palette names).
   Rarity of an item: common muted · rare lime · epic orange · legendary gold (only legendary may glow).
   Verdict of a myth: fact lime · myth red · half true orange · it depends muted · rumour pale smoke,
   always drawn with a DASHED border (there is no violet in the palette; the dash is what marks a rumour).
   All keep ≥ 4.5:1 on --card in their theme. */
:root {
  --rar-common: var(--muted);
  --rar-rare: var(--lcd-d);
  --rar-epic: var(--fire-2);
  --rar-legendary: var(--fire-3);
  --v-fact: var(--lcd-d);
  --v-myth: var(--fire-0);
  --v-half: var(--fire-2);
  --v-depends: var(--muted);
  --v-rumour: var(--fire-4);
}
:root[data-theme="light"] {
  --rar-common: #56654f;
  --rar-rare: #306230;
  --rar-epic: #9a3f00;
  --rar-legendary: #6f5600;
  --v-fact: #306230;
  --v-myth: #b2391c;
  --v-half: #9a3f00;
  --v-depends: #56654f;
  --v-rumour: #56654f;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 var(--sans);
}

/* Headlines and labels in the pixel font — big, never for long sentences */
.px-title { font-family: var(--pixel); font-weight: 400; letter-spacing: 0.02em; line-height: 0.95; }
.px-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* Pixel art: crisp at every scale */
.pixelart, .pixelart svg, svg.pixelart { image-rendering: pixelated; shape-rendering: crispEdges; }

/* Pixel frame: a 1-art-pixel border with cut corners, like an old handheld UI */
.px-frame {
  background: var(--card);
  border: var(--px) solid var(--night-4);
  box-shadow: 0 0 0 var(--px) var(--night-0), var(--px) var(--px) 0 var(--px) var(--night-0);
}

/* Buttons that feel like hardware keys */
.px-btn {
  font: 20px/1 var(--pixel);
  color: var(--night-0);
  background: var(--lcd-d);
  border: 0;
  padding: 12px 18px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b), 0 var(--px) 0 var(--night-0);
}
.px-btn:hover { background: var(--lcd-e); }
.px-btn:active { transform: translateY(var(--px)); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--lcd-b); }
.px-btn.fire { background: var(--fire-2); box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--fire-1), 0 var(--px) 0 var(--night-0); }
.px-btn.fire:hover { background: var(--fire-3); }

:focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }

/* Flicker helpers for HTML (SVG scenes carry their own copy of these keyframes) */
@keyframes px-flicker { 0% { opacity: 1; } 50% { opacity: 0.82; } 100% { opacity: 1; } }
@keyframes px-frames-3 { from { transform: translateX(0); } to { transform: translateX(-300%); } }
@keyframes px-blink { 0%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  /* ── Rendering ───────────────────────────────────────────────────────────── */

  function check(name, rows) {
    const w = rows[0].length;
    rows.forEach((r, i) => { if (r.length !== w) throw new Error(`PX: sprite "${name}" row ${i} has ${r.length} px, expected ${w}`); });
    return w;
  }

  /** Path data for every pixel equal to `ch` (runs merged), offset by ox/oy */
  function runPath(rows, ch, ox, oy) {
    let d = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== ch) continue;
        let n = 1;
        while (row[x + n] === ch) n++;
        d += `M${ox + x} ${oy + y}h${n}v1h-${n}z`;
        x += n - 1;
      }
    });
    return d;
  }

  /** Sprite → '<path fill=… d=…/>' per colour. opts: { x, y, pal (overrides), cls } */
  function sprite(nameOrRows, opts) {
    const o = opts || {};
    const rows = typeof nameOrRows === 'string' ? SPRITES[nameOrRows] : nameOrRows;
    if (!rows) throw new Error(`PX: unknown sprite "${nameOrRows}"`);
    check(String(nameOrRows), rows);
    const pal = Object.assign({}, PAL, o.pal || {});
    const chars = [...new Set(rows.join(''))].filter((c) => c !== '.');
    const cls = o.cls ? ` class="${o.cls}"` : '';
    return `<g${cls}>${chars.map((c) => `<path fill="${pal[c] || c}" d="${runPath(rows, c, o.x || 0, o.y || 0)}"/>`).join('')}</g>`;
  }

  /** Icon → one path (fill = currentColor unless given) */
  function icon(name, opts) {
    const o = opts || {};
    const rows = ICONS[name];
    if (!rows) throw new Error(`PX: unknown icon "${name}"`);
    check(name, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;
  }

    const title = o.title ? `<title>${o.title}</title>` : '';
    const desc = o.desc ? `<desc>${o.desc}</desc>` : '';
    const style = o.css ? `<style>${o.css}</style>` : '';
    const bg = o.bg ? `<rect width="${o.w}" height="${o.h}" fill="${o.bg}"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${o.w} ${o.h}" width="${o.w * (o.scale || 1)}" height="${o.h * (o.scale || 1)}" shape-rendering="crispEdges" role="img">${title}${desc}${style}${bg}${o.body}</svg>`;
  }

  const glyph = (ch) => FONT5x7[ch] || FONT5x7[ch.toUpperCase()] || FONT5x7['?'];
  const LINE_H = 9; // 7 px glyph + 2 px leading

  /** Width of one line (or the widest line) in px at the given scale (default 1) */
  function textWidth(str, scale) {
    const s = scale || 1;
    return Math.max(...String(str).split('\n').map((line) => {
      const w = [...line].reduce((a, ch) => a + glyph(ch)[0].length + 1, 0);
      return Math.max(0, w - 1) * s;
    }));
  }

  /** Text → one '<path>' of merged pixel runs. opts: { x, y (top edge), fill, scale, align: 'left'|'center'|'right' }.
      '\n' starts a new line (9 px line height × scale). Default fill = PAL.i (ink on night). */
  function text(str, opts) {
    const o = opts || {};
    const s = o.scale || 1;
    let d = '';
    String(str).split('\n').forEach((line, li) => {
      const lw = textWidth(line, s);
      let cx = (o.x || 0) - (o.align === 'center' ? Math.floor(lw / 2) : o.align === 'right' ? lw : 0);
      const cy = (o.y || 0) + li * LINE_H * s;
      for (const ch of line) {
        const rows = glyph(ch);
        rows.forEach((row, ry) => {
          for (let x = 0; x < row.length; x++) {
            if (row[x] !== '#') continue;
            let n = 1;
            while (row[x + n] === '#') n++;
            d += `M${cx + x * s} ${cy + ry * s}h${n * s}v${s}h-${n * s}z`;
            x += n - 1;
          }
        });
        cx += (rows[0].length + 1) * s;
      }
    });
    return `<path fill="${o.fill || PAL.i}" d="${d}"/>`;
  }

  /** Item icon → one path (fill = currentColor unless given). opts: { x, y, fill } */
  function item(id, opts) {
    const o = opts || {};

    if (!rows) throw new Error(`PX: unknown item "${id}"`);
    check(id, rows);
    return `<path fill="${o.fill || 'currentColor'}" d="${runPath(rows, '#', o.x || 0, o.y || 0)}"/>`;

<style>
  html, body { height: 100%; }
  /* Verdict colours come from shared/campfire.css (--v-fact, --v-myth, --v-half, --v-depends, --v-rumour).
     A rumour is smoke: always a dashed frame, on the stamp and on the button. */
  body {
    height: 100vh; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 15px;
  }
  .px-label { font-size: 13px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
  .top h1 { margin: 0; font-size: 28px; color: var(--fire-3); }
  .top .sub { margin: 0; color: var(--muted); }
  .top .score { margin-left: auto; font: 600 14px/1.2 var(--sans); color: var(--ink); }
  .top .score b { font: 22px/1 var(--pixel); color: var(--lcd-e); font-weight: 400; }

  /* The claim card */
  .card { position: relative; flex: 1; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .card.thump { animation: mf-thump calc(var(--step) * 2) steps(1, end) calc(var(--step) * 2); }
  @keyframes mf-thump { 0% { transform: translate(3px, 3px); } 50% { transform: translate(-1px, 0); } 100% { transform: none; } }
  .count { font: 20px/1 var(--pixel); color: var(--lcd-d); }
  .count b { color: var(--fire-3); font-weight: 400; }
  .claim { margin: 0; font: 700 20px/1.25 var(--sans); color: var(--ink); text-wrap: balance; }
  .result { display: flex; align-items: flex-start; gap: 12px; flex: none; }
  .hint { margin: 0; color: var(--muted); font-size: 15px; }
  .why { margin: 0; font-size: 14px; line-height: 1.35; color: var(--ink); }
  .source { margin: 6px 0 0; font-size: 14px; line-height: 1.35; }
  .source a { color: var(--ink); text-underline-offset: 0.2em; }
  .source a:hover { color: var(--fire-3); }
  .verdict { margin: 4px 0 0; font: 600 14px/1.3 var(--sans); }
  .verdict.right { color: var(--lcd-d); }
  .verdict.wrong { color: var(--muted); }   /* not fire-2: that is "half true" */
  .verdict .mark { font: 20px/1 var(--pixel); margin-right: 6px; }

  .stamp {
    --c: var(--v-fact);
    flex: none; transform: rotate(-6deg); margin: 6px 4px 0 2px;
    font: 28px/1 var(--pixel); letter-spacing: 0.04em; white-space: nowrap;
    padding: 6px 10px 4px; color: var(--night-0); background: var(--c); border: 3px solid var(--c);
    box-shadow: inset 0 0 0 3px var(--night-0), 4px 4px 0 var(--night-0);
  }
  .stamp.myth { --c: var(--v-myth); }
  .stamp.half { --c: var(--v-half); }
  .stamp.depends { --c: var(--v-depends); }
  .stamp.rumour { --c: var(--v-rumour); background: var(--night-0); color: var(--c); border-style: dashed; box-shadow: 4px 4px 0 var(--night-0); }
  .stamp.hit { animation: mf-stamp calc(var(--step) * 4) steps(1, end) both; }
  @keyframes mf-stamp {
    0% { transform: rotate(-6deg) scale(2.4); opacity: 0; }
    25% { transform: rotate(-9deg) scale(1.6); opacity: 0.6; }
    50% { transform: rotate(-5deg) scale(0.9); opacity: 1; }
    75% { transform: rotate(-6deg) scale(1.04); }
    100% { transform: rotate(-6deg) scale(1); opacity: 1; }
  }
  .result[hidden], .hint[hidden], .verdict[hidden] { display: none; }

  /* Controls */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .row > .px-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .g {
    --c: var(--v-fact);
    font: 600 14px/1 var(--sans); color: var(--ink); background: var(--night-3); border: 2px solid var(--night-4); border-left: 8px solid var(--c);
    min-height: 40px; padding: 6px 9px; cursor: pointer; border-radius: 0;
  }
  .g:hover { background: var(--night-4); }
  .g u { text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .g[data-v="myth"] { --c: var(--v-myth); }
  .g[data-v="half"] { --c: var(--v-half); }
  .g[data-v="rumour"] { --c: var(--v-rumour); border-style: dashed; border-color: var(--muted) var(--muted) var(--muted) var(--c); }
  .g[data-v="depends"] { --c: var(--v-depends); }
  .g[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--night-0); }
  /* pressed rumour stays smoke: dark fill, pale dashed frame (a filled frame would hide the dashes) */
  .g[data-v="rumour"][aria-pressed="true"] { background: var(--night-0); color: var(--c); border-color: var(--c); }
  .g[disabled] { cursor: default; opacity: 0.55; }
  .row .px-btn { font-size: 17px; min-height: 40px; padding: 8px 12px; }
  .px-btn[disabled] { opacity: 0.5; cursor: default; }
  #reveal { margin-left: auto; }
  .keys { margin-left: auto; display: none; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    .result { flex-direction: column; }
  }

  /* Projector: the claim is the slide */
  @media (min-width: 1024px) and (min-height: 600px) {
    body { padding: clamp(14px, 2.5vh, 18px) 24px; gap: clamp(10px, 1.75vh, 14px); font-size: 22px; }
    .px-label { font-size: 16px; }
    .top h1 { font-size: clamp(42px, 7.2vh, 56px); }
    .top .sub { font-size: clamp(22px, 3.3vh, 26px); }
    .top .score { font-size: 22px; }
    .top .score b { font-size: 40px; }
    .card { padding: clamp(14px, 2.4vh, 22px) 30px; gap: clamp(10px, 1.8vh, 18px); }
    .count { font-size: clamp(27px, 4.1vh, 34px); }
    .claim { font-size: clamp(34px, 6.1vh, 52px); line-height: 1.12; }
    .result { gap: clamp(20px, 3.4vh, 30px); }
    .hint { font-size: 26px; }
    .why { font-size: clamp(19px, 3.2vh, 26px); line-height: 1.35; }
    .source { font-size: clamp(17px, 2.4vh, 20px); margin-top: 8px; }
    .verdict { font-size: clamp(19px, 2.9vh, 24px); margin-top: 8px; }
    .verdict .mark { font-size: clamp(26px, 3.9vh, 34px); }
    .stamp { font-size: clamp(44px, 7.7vh, 64px); padding: 12px 20px 8px; border-width: 6px; box-shadow: inset 0 0 0 5px var(--night-0), 8px 8px 0 var(--night-0); margin: 12px 8px 0 4px; }
    .stamp.rumour { box-shadow: 8px 8px 0 var(--night-0); }
    .row { gap: 10px; }
    .g { font-size: 22px; min-height: 52px; padding: 10px 16px; border-left-width: 12px; }
    .row .px-btn { font-size: 26px; min-height: 52px; padding: 12px 20px; }
    .keys { display: block; }
    .row > .px-label { position: static; width: auto; height: auto; overflow: visible; clip: auto; margin-right: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.hit, .card.thump { animation: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <h1 class="px-title">Myth or fact?</h1>
  <p class="sub">The AI rumour mill.</p>
  <p class="score" id="score" aria-live="polite"></p>
</header>

<article class="card px-frame" id="card" aria-labelledby="claim">
  <div class="count" id="count" aria-hidden="true"></div>
  <p class="claim" id="claim"></p>
  <p class="hint" id="hint">Hands up: fact, myth, half true, rumour, or it depends?</p>
  <div class="result" id="result" hidden>
    <div class="stamp" id="stamp"></div>
    <div>
      <p class="why" id="why"></p>
      <p class="source"><a id="source" target="_blank" rel="noopener noreferrer"></a></p>
      <p class="verdict" id="verdict" hidden></p>
    </div>
  </div>
</article>

<div class="row" role="group" aria-label="Room says">
  <span class="px-label">Room says</span>
  <button class="g" type="button" data-v="fact" aria-pressed="false" aria-keyshortcuts="F"><u>F</u>act</button>
  <button class="g" type="button" data-v="myth" aria-pressed="false" aria-keyshortcuts="M"><u>M</u>yth</button>
  <button class="g" type="button" data-v="half" aria-pressed="false" aria-keyshortcuts="H"><u>H</u>alf true</button>
  <button class="g" type="button" data-v="rumour" aria-pressed="false" aria-keyshortcuts="R"><u>R</u>umour</button>
  <button class="g" type="button" data-v="depends" aria-pressed="false" aria-keyshortcuts="D">It <u>d</u>epends</button>
  <button class="px-btn fire" type="button" id="reveal" aria-keyshortcuts="Space">Reveal</button>
</div>
<div class="row">
  <button class="px-btn" type="button" id="prev" aria-keyshortcuts="ArrowLeft">Previous</button>
  <button class="px-btn" type="button" id="next" aria-keyshortcuts="N">Next</button>
  <button class="px-btn" type="button" id="shuffle" aria-keyshortcuts="S">Shuffle</button>
  <span class="keys px-label">Keys: F M H R D · Space reveal · arrows · S shuffle</span>
</div>
<p class="sr" id="live" aria-live="assertive"></p>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const MYTHS = [
    {
      claim: 'AI researchers once planned to crack it in a single summer.',
      verdict: 'half',
      why: 'The 1955 proposal for the Dartmouth workshop called for ten researchers to work together for two months. The goal was significant progress on at least one problem.',
      source: '1955 Dartmouth proposal',
      url: 'https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html',
    },
    {
      claim: 'The first computer bug was a real moth.',
      verdict: 'half',
      why: 'In 1947 engineers found a moth in the Harvard Mark II and taped it into the logbook. Engineers had already used “bug” for technical faults long before that.',
      source: 'Smithsonian Mark II logbook',
      url: 'https://www.americanhistory.si.edu/collections/object/nmah_334663',
    },
    {
      claim: 'A car dealer’s chatbot sold a new SUV for $1.',
      verdict: 'half',
      why: 'In 2023, a dealer’s chatbot generated a message offering a Chevy Tahoe for $1. The exchange was a chat message. There was no reported sale.',
      source: 'Fullpath’s account of the exchange',
      url: 'https://www.fullpath.com/blog/what-really-happened-when-fullpaths-chatgpt-chatbot-went-viral/',
    },
    {
      claim: 'A Google search summary once suggested glue on pizza.',
      verdict: 'fact',
      why: 'In 2024, a Google AI Overview picked up a satirical forum comment and suggested glue to make the cheese stick.',
      source: 'Associated Press on Google AI Overviews',
      url: 'https://apnews.com/article/google-ai-overviews-hallucination-33060569d6cc01abe6c63d21665330d8',
    },
    {
      claim: 'Analysts estimated that 100 million people used ChatGPT in January 2023.',
      verdict: 'fact',
      why: 'UBS estimated 100 million monthly active users about two months after launch. The number came from Similarweb data.',
      source: 'Reuters reporting on the UBS estimate',
      url: 'https://www.marketscreener.com/news/latest/ChatGPT-sets-record-for-fastest-growing-user-base-analyst-note-42873811/',
    },
    {
      claim: 'Google confirmed its LaMDA chatbot was sentient in 2022.',
      verdict: 'myth',
      why: 'A Google engineer argued that LaMDA was sentient. Google reviewed the claim and said that the evidence did not support it.',
      source: 'ABC News on the LaMDA claim',
      url: 'https://www.abc.net.au/news/2022-06-13/google-ai-lamda-sentient-engineer-blake-lemoine-says/101147222',
    },
    {
      claim: 'Language models can miscount the r’s in “strawberry”.',
      verdict: 'fact',
      why: 'Some models have missed the three r’s. Researchers tested letter counting across words and found that error rates varied by model.',
      source: 'Letter-counting study',
      url: 'https://arxiv.org/abs/2412.18626',
    },
    {
      claim: 'A US judge fined lawyers over fake cases supplied by ChatGPT.',
      verdict: 'fact',
      why: 'In 2023, a federal judge imposed a joint $5,000 penalty on two lawyers and their firm after they filed fake cases and stood by them after being asked to check.',
      source: 'Mata v. Avianca sanctions order',
      url: 'https://www.nhd.uscourts.gov/sites/default/files/pdf/Mata-v-Avianca-sanctions-order.PDF',
    },
    {
      claim: 'Air Canada had to compensate a passenger after its chatbot misstated a fare policy.',
      verdict: 'fact',
      why: 'In 2024, British Columbia’s Civil Resolution Tribunal held Air Canada responsible for its chatbot’s incorrect bereavement-fare advice and awarded damages.',
      source: 'Moffatt v. Air Canada tribunal decision',
      url: 'https://www.thesedonaconference.org/sites/default/files/meeting_paper/Moffet%20v%20AirCanada.pdf',
    },
    {
      claim: 'Nvidia lost over $500 billion in market value in a day after DeepSeek-R1’s release.',
      verdict: 'fact',
      why: 'Reuters reported an estimated US$593 billion drop in Nvidia’s market value on 27 January 2025 amid a sell-off after the release.',
      source: 'Reuters coverage of the market sell-off',
      url: 'https://theprint.in/tech/deepseek-sparks-ai-stock-selloff-nvidia-posts-record-market-cap-loss/2466180/',
    },
    {
      claim: 'The reported Q* project brought OpenAI close to artificial general intelligence in 2023.',
      verdict: 'rumour',
      why: 'Reuters reported that an unnamed source saw Q* as a possible step towards general intelligence. The reported results were at the level of school maths, and the broader claim remains unverified.',
      source: 'Original Reuters reporting on Q*',
      url: 'https://uk.investing.com/news/stock-market-news/exclusivesam-altmans-ouster-at-openai-was-precipitated-by-letter-to-board-about-ai-breakthrough-sources-3246958',
    },
    {
      claim: 'ChatGPT uses what you type to train its models.',
      verdict: 'depends',
      why: 'OpenAI says it may use eligible content from personal ChatGPT for training unless you opt out. ChatGPT Business and Enterprise content is excluded by default.',
      source: 'OpenAI’s training data policy',
      url: 'https://openai.com/policies/how-your-data-is-used-to-improve-model-performance/',
    },
    {
      claim: '“Vibe coding” was a 2025 Word of the Year.',
      verdict: 'fact',
      why: 'Collins named it its 2025 Word of the Year and credits Andrej Karpathy with coining the term.',
      source: 'Collins’ 2025 announcement',
      url: 'https://blog.collinsdictionary.com/language-lovers/collins-word-of-the-year-2025-ai-meets-authenticity-as-society-shifts/',
    },
    {
      claim: 'US employers had fewer than 100,000 graphic designers on payroll in May 2025.',
      verdict: 'myth',
      why: 'The US Bureau of Labor Statistics estimated nearly 198,000 wage and salary jobs for graphic designers in May 2025.',
      source: 'US Bureau of Labor Statistics, May 2025 estimates',
      url: 'https://www.bls.gov/news.release/archives/ocwage_05152026.htm',
    },
  ];
  const LABEL = { fact: 'FACT', myth: 'MYTH', half: 'HALF TRUE', rumour: 'RUMOUR', depends: 'IT DEPENDS' };
  const SAY = { fact: 'Fact', myth: 'Myth', half: 'Half true', rumour: 'Rumour', depends: 'It depends' };
  const KEYS = { f: 'fact', m: 'myth', h: 'half', r: 'rumour', d: 'depends' };

  let order = MYTHS.map((_, i) => i);
  let pos = 0;
  let state = {};            // claim index → { guess, revealed }

  const cur = () => order[pos];
  const st = () => (state[cur()] = state[cur()] || { guess: null, revealed: false });

  function score() {
    let right = 0, total = 0;
    Object.keys(state).forEach((k) => { const s = state[k]; if (s.revealed && s.guess) { total++; if (s.guess === MYTHS[k].verdict) right++; } });
    $('score').innerHTML = total ? `Room: <b>${right} / ${total}</b> right` : 'Room score: <b>0 / 0</b>';
  }

  function render(animate) {
    const m = MYTHS[cur()], s = st();
    $('count').innerHTML = `<b>${pos + 1}</b> / ${order.length}`;
    $('claim').textContent = m.claim;
    $('hint').hidden = s.revealed;
    document.querySelectorAll('.g').forEach((b) => { b.setAttribute('aria-pressed', String(b.dataset.v === s.guess)); b.disabled = s.revealed; });
    $('reveal').disabled = s.revealed;
    $('result').hidden = !s.revealed;
    const stamp = $('stamp'), source = $('source');
    stamp.className = s.revealed ? 'stamp ' + m.verdict : 'stamp';
    stamp.textContent = s.revealed ? LABEL[m.verdict] : '';
    $('why').textContent = s.revealed ? m.why : '';
    source.textContent = s.revealed ? 'Source · ' + m.source : '';
    if (s.revealed) source.href = m.url;
    else source.removeAttribute('href');
    const v = $('verdict');
    v.hidden = !(s.revealed && s.guess);
    v.className = 'verdict';
    v.textContent = '';
    if (s.revealed && s.guess) {
      const ok = s.guess === m.verdict;
      v.className = 'verdict ' + (ok ? 'right' : 'wrong');
      v.innerHTML = `<span class="mark" aria-hidden="true">${ok ? '+1' : 'x'}</span>Room said ${SAY[s.guess]}. Room was ${ok ? 'right' : 'wrong'}.`;
    }
    if (animate) {
      stamp.classList.remove('hit'); $('card').classList.remove('thump');
      void stamp.offsetWidth;
      stamp.classList.add('hit'); $('card').classList.add('thump');
    }
    score();
  }

  function guess(v) {
    const s = st();
    if (s.revealed) return;
    s.guess = s.guess === v ? null : v;
    $('live').textContent = s.guess ? `Room says ${SAY[v]}.` : 'Guess cleared.';
    render(false);
  }
  function reveal() {
    const s = st();
    if (s.revealed) return;
    s.revealed = true;
    const m = MYTHS[cur()];
    render(true);
    $('live').textContent = `${LABEL[m.verdict]}. ${m.why}` + (s.guess ? ` Room was ${s.guess === m.verdict ? 'right' : 'wrong'}.` : '');
  }
  function go(d) {
    const p = Math.max(0, Math.min(order.length - 1, pos + d));
    if (p === pos) return;
    pos = p; render(false);
    $('live').textContent = `Claim ${pos + 1} of ${order.length}: ${MYTHS[cur()].claim}`;
  }
  function shuffle() {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    pos = 0; state = {};
    render(false);
    $('live').textContent = `Shuffled, score reset. Claim 1: ${MYTHS[cur()].claim}`;
  }

  document.querySelectorAll('.g').forEach((b) => b.addEventListener('click', () => guess(b.dataset.v)));
  $('reveal').addEventListener('click', reveal);
  $('prev').addEventListener('click', () => go(-1));
  $('next').addEventListener('click', () => go(1));
  $('shuffle').addEventListener('click', shuffle);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const a = document.activeElement;
    if (k === 'enter' && a?.matches('a[href]')) return;
    const kbFocusBtn = a && a.tagName === 'BUTTON' && a.matches(':focus-visible');
    if (k in KEYS) { e.preventDefault(); guess(KEYS[k]); }
    else if ((k === ' ' || k === 'enter') && !kbFocusBtn) { e.preventDefault(); reveal(); }
    else if (k === 'arrowright' || k === 'pagedown') { e.preventDefault(); if (!st().revealed) reveal(); else go(1); }
    else if (k === 'arrowleft' || k === 'pageup') { e.preventDefault(); go(-1); }
    else if (k === 'n') { e.preventDefault(); go(1); }
    else if (k === 'p') { e.preventDefault(); go(-1); }
    else if (k === 's') { e.preventDefault(); shuffle(); }
  });

  render(false);
})();
</script>
</body>
